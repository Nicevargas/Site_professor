name: Avisar novidade para o WhatsApp

# Novidade nova no main → issue para a Nice com o link "Enviar no WhatsApp".
# Substitui o n8n + Evolution da VPS (fora do ar em 16/09/2026): não precisa de
# servidor nem de token extra, só do GITHUB_TOKEN que o próprio Actions dá.
on:
  push:
    branches: [main]
    paths:
      - "novidades/*.md"
  # Reenviar a prévia de uma novidade que já existe (ex.: depois de trocar a
  # imagem). Só manda a prévia para a Nice; não abre issue de novo.
  workflow_dispatch:
    inputs:
      arquivo:
        description: "Novidade para reenviar a prévia (novidades/AAAA-MM-DD-assunto.md)"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: novidade-whatsapp
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Conferir as regras do aviso
        run: node --test automacoes/whatsapp/aviso.teste.mjs automacoes/aprovacao/fluxo.teste.mjs

      - name: Abrir o aviso para enviar no grupo
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTES: ${{ github.event.before }}
          RESPONSAVEL: Nicevargas
        run: node automacoes/whatsapp/avisar.mjs

      # Prévia no WhatsApp da Nice, com link de aprovação (automacoes/aprovacao).
      # Sem os dois segredos, o passo só avisa que está desligado. Se o n8n
      # falhar, a issue acima já foi aberta: o envio manual continua valendo.
      - name: Mandar a prévia para aprovação no WhatsApp
        continue-on-error: true
        env:
          N8N_NOVIDADE_URL: ${{ secrets.N8N_NOVIDADE_URL }}
          N8N_NOVIDADE_TOKEN: ${{ secrets.N8N_NOVIDADE_TOKEN }}
          ANTES: ${{ github.event.before }}
          ARQUIVO: ${{ inputs.arquivo }}
        run: node automacoes/aprovacao/enviar-previa.mjs ${ARQUIVO:+--arquivos "$ARQUIVO"}
